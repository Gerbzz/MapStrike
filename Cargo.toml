[package]
name = "mapstrike"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
native-ui = ["dep:eframe", "dep:rfd", "dep:image"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
eframe = { version = "0.30", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "glow"], optional = true }
rfd = { version = "0.15", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[[bin]]
name = "mapstrike-ui"
path = "src/bin/mapstrike-ui.rs"
required-features = ["native-ui"]
