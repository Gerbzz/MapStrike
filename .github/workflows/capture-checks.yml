name: Capture checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: rustfmt --edition 2024 --check src/bin/mapstrike-capture.rs
      - run: cargo test --locked --features native-ui --bin mapstrike-capture
      - run: cargo build --locked --features native-ui --bin mapstrike-capture
