name: Source checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Test core blockout and inventory logic
        run: cargo test --locked --lib
      - name: Build command-line tool
        run: cargo build --locked --bin mapstrike
      - name: Test native view model and VMAP export
        run: cargo test --locked --features native-ui --lib
      - name: Build native window
        run: cargo build --locked --features native-ui --bin mapstrike-ui
